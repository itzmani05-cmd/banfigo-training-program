# Serves the built React app inside the frontend container (the gateway in nginx/nginx.conf sits in front of it).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed build assets never change, so let browsers cache them
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to index.html; index.html itself is never cached
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
