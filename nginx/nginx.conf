# API gateway: the single entry point for the Banfigo stack.
#   /        -> React frontend   (frontend:80)
#   /api/    -> Spring Boot API  (backend:8082)
#   /auth/   -> Keycloak         (keycloak:8080, which serves everything under /auth)
#   /health  -> Spring Boot health check
# Upstreams are Docker service names, resolved on the compose network.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Access log shows which upstream answered and how long it took, to make routing problems easy to spot.
  # Written to stdout (docker compose logs nginx) and to a file in the nginx_logs volume.
  log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'upstream=$upstream_addr upstream_status=$upstream_status '
                     'request_time=$request_time upstream_time=$upstream_response_time';
  access_log /dev/stdout gateway;
  access_log /var/log/nginx/banfigo/access.log gateway;
  error_log  /dev/stderr warn;
  error_log  /var/log/nginx/banfigo/error.log warn;

  # Rate limiting, per client IP. Over the limit -> 429 with the API's JSON error shape (see @rate_limited).
  #   api:       all /api/ calls, a generous cap so normal page loads never hit it
  #   api_write: POST/PUT/PATCH/DELETE on /api/ (money moves, approvals), much tighter
  #   login:     POSTs to Keycloak's login form and token endpoint, against password guessing
  # A request whose key is empty is not counted, which is how the method-based zones skip GETs.
  map $request_method $write_limit_key {
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
    default "";
  }
  map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $binary_remote_addr zone=api:10m       rate=20r/s;
  limit_req_zone $write_limit_key    zone=api_write:10m rate=5r/s;
  limit_req_zone $login_limit_key    zone=login:10m     rate=10r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  upstream frontend { server frontend:80; }
  upstream backend  { server backend:8082; }
  upstream keycloak { server keycloak:8080; }

  server {
    listen 80;
    server_name _;

    # Statement PDFs and request bodies stay small; this is just a sane cap
    client_max_body_size 10m;

    # Headers every upstream needs to know the original request
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;

    location /api/ {
      limit_req zone=api       burst=40 nodelay;
      limit_req zone=api_write burst=10 nodelay;
      error_page 429 = @rate_limited;
      proxy_pass http://backend;
    }

    location = /health {
      proxy_pass http://backend;
    }

    # Username/password submit and the token endpoint (code exchange and token refresh)
    location ~ ^/auth/realms/[^/]+/(login-actions/authenticate|protocol/openid-connect/token)$ {
      limit_req zone=login burst=10 nodelay;
      error_page 429 = @rate_limited;
      proxy_pass http://keycloak;
      proxy_buffer_size       128k;
      proxy_buffers           4 256k;
      proxy_busy_buffers_size 256k;
    }

    location /auth/ {
      proxy_pass http://keycloak;
      # Keycloak sends large cookies/headers (tokens) on login
      proxy_buffer_size       128k;
      proxy_buffers           4 256k;
      proxy_busy_buffers_size 256k;
    }

    location / {
      proxy_pass http://frontend;
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"timestamp":"$time_iso8601","status":429,"error":"Too Many Requests","message":"Too many requests. Please wait a moment and try again."}';
    }
  }
}
