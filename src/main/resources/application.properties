spring.application.name=banfigo
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/student_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8086/realms/BanfigoNew
# Largest amount a single deposit, withdrawal or transfer may move
banfigo.limits.max-transaction-amount=100000
